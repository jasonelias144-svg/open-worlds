# The Rust workspace: the worlds themselves, built to the standards in
# docs/COLLABORATING.md ("Code in Rust"), and checked against the Python
# reference through the shared test vectors in ../vectors.

[workspace]
members = ["world-log", "ur-world", "formats"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "CC0-1.0"
publish = false

# Every dependency is named here once, with why it is here. Cargo.lock is
# committed, and CI builds with --locked.
[workspace.dependencies]
# Reads JSON (logs and test vectors). Writing JSON for hashing is done by
# world-log itself, to match Python's text exactly.
serde_json = "1.0.154"
# SHA-256, from the RustCrypto project: hashes are never written by hand.
sha2 = "0.11.1"
# RFC 8785, the JSON Canonicalization Scheme, for records that are signed
# (formats): written by the library, not by hand.
serde_jcs = "0.2.0"
# Ed25519 signing and verifying (formats), from the dalek project; its
# verify_strict refuses weak keys, as multiverse/ed25519.py does.
ed25519-dalek = "3.0.0"
# Base58-btc, for Multikey and proofValue (formats); Python writes its own,
# so the two are checked against each other through the shared vectors.
bs58 = "0.5.1"
# JSON Schema 2020-12, to read schemas/records-v1.schema.json as the Python
# code does (formats). Without its default features, so it never fetches
# anything over the network; 0.60.2, three weeks old, rather than a release
# of the last few days.
jsonschema = { version = "=0.60.2", default-features = false }
# HPKE (RFC 9180) for sealing (formats), the same suite as Python's
# cryptography: only base mode with X25519, HKDF-SHA256 and
# ChaCha20Poly1305 is turned on. Its authors say it has had no paid audit;
# Cloudflare reviewed version 0.8. Pinned exactly, as it is pre-1.0.
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
# X25519 (formats), to refuse a sealing key of small order before sealing
# to it, as formats/seal.py does. hpke already brings this crate in.
x25519-dalek = { version = "3.0.0", default-features = false }

# The lints hold for every crate; a crate doesn't loosen them.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Never panic on what comes from outside: return a Result instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
