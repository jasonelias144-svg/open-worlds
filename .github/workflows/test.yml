name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # The oldest Python README promises, and the one RDKit is checked on.
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 --version
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -t . -v
      - run: python3 -m experiments.corridor --quick
      - run: python3 -m multiverse.collaboration
  rdkit-crosscheck:
    # Compares the chemistry with RDKit (tests/test_chem_rdkit.py). Pinned
    # Python and RDKit, so the reference doesn't move under us.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install rdkit==2024.3.5
      - run: python -m unittest tests.test_chem_rdkit -v
        env:
          OPEN_WORLDS_REQUIRE_RDKIT: "1"
  sketches:
    # DeepSeek's sketch code, kept as a record (sketches/README.md), in a
    # job of its own: open-worlds never imports it, and its results are
    # never mixed with open-worlds' own. Checks that the code matches the
    # record (apart from changes INDEX.md lists), and that exactly the
    # tests in known-failures.txt fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r sketches/requirements.txt
      - run: python sketches/tools/extract.py check-all sketches
      - run: |
          for folder in sketches/deepseek/*/; do
            echo "== $folder"
            (cd "$folder" && python -m pytest -q) || exit 1
          done
        env:
          # One fixed hash seed, so that set order is the same on every
          # run; tests that vary for other reasons are marked "sometimes"
          # in known-failures.txt.
          PYTHONHASHSEED: "0"
  rust:
    # The Rust workspace (docs/COLLABORATING.md, "Code in Rust"): the pinned
    # toolchain, formatting, lints as errors, and tests, which read the
    # shared vectors that the Python job checks are the kernel's own.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - run: cargo --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -q -p world-log -- ../vectors/world-log.json
      - run: cargo run --locked -q -p world-log -- ../vectors/ur-garden-log.json
      - run: cargo run --locked -q -p ur-world --example garden
