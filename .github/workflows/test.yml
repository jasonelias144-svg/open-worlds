name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # The oldest Python README promises, and the one RDKit is checked on.
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 --version
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -t . -v
      - run: python3 -m experiments.corridor --quick
      - run: python3 -m multiverse.collaboration
  rdkit-crosscheck:
    # Compares the chemistry with RDKit (tests/test_chem_rdkit.py). Pinned
    # Python and RDKit, so the reference doesn't move under us.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install rdkit==2024.3.5
      - run: python -m unittest tests.test_chem_rdkit -v
        env:
          OPEN_WORLDS_REQUIRE_RDKIT: "1"
  sketches:
    # DeepSeek's sketch code, kept as a record (sketches/README.md), in a
    # job of its own: open-worlds never imports it, and its results are
    # never mixed with open-worlds' own. Checks that the code matches the
    # record (apart from changes INDEX.md lists), and that exactly the
    # tests in known-failures.txt fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r sketches/requirements.txt
      - run: >-
          python sketches/tools/extract.py check
          sketches/records/012-04-00-DPSK-Patterns_Multiverses.txt
          sketches/tools/names-012-04-00.json
          sketches/deepseek/012-04-00
      - run: python -m pytest -q
        working-directory: sketches/deepseek/012-04-00
        env:
          # One fixed hash seed, so that set order is the same on every
          # run; tests that vary for other reasons are marked "sometimes"
          # in known-failures.txt.
          PYTHONHASHSEED: "0"
