[package]
name = "chat-world"
version = "0.1.0"
edition = "2021"
description = "Chat worlds for the multiverse — WCP/0.4 reference implementation"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
bs58 = "0.5"
hex = "0.4"
chrono = "0.4"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
